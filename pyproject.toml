[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "urea-nitrate-cell"
version = "0.1.0"
description = "Thermodynamics, kinetics and mass-transport model of a urea–nitrate direct cell (UOR ‖ NO3RR), calibrated to published LSV data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shuruyue" }]
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["urea_nitrate_cell"]

[tool.pytest.ini_options]
testpaths = ["tests"]
